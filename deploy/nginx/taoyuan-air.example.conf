# 範本檔案，僅供參考，不會被自動部署套用，也不會覆蓋 Production Nginx config。
#
# 適用情境：Nginx 收到的 request 保留 /tyair 前綴（推薦方向 A，見
# docs/DEPLOYMENT_OPERATION_GUIDE.md 第 6 節），Next.js 用 basePath=/tyair 處理。
# 實際 listen port、server_name、TLS 設定、NCU real-IP 設定都必須用 VM 現況
# （sudo nginx -T）確認後才能套用，不要直接照抄這份檔案。

server {
    # listen port 必須依 VM 實測的 433 用途決定，這裡先佔位
    listen __LISTEN_PORT__;
    server_name __SERVER_NAME__;

    # NCU 若是 reverse proxy 進來，這幾行要依實際 NCU IP 調整
    # set_real_ip_from 140.115.0.251;
    # real_ip_header X-Real-IP;

    location /tyair/api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tyair/ {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
