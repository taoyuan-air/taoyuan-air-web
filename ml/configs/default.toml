train_cutoff_date = "2025-07-01"
grid_resolution = 0.01

[bbox]
lat_min = 24.77
lat_max = 25.15
lon_min = 121.05
lon_max = 121.5

[xgb]
n_estimators = 500
max_depth = 6
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.8
random_state = 42
n_jobs = -1

[variables]


[variables.pm25]
parquet = "pm25_hourly.parquet"
value_col = "pm25"
lag_hours = [1, 2, 3, 6, 12, 24]
use_altitude = false
use_rain_flag = false
circular = false
external_features = ["temperature", "humidity", "wind_speed", "wind_u", "wind_v", "pressure"]
clip_min = 0.0
unit = "ug/m3"

[variables.temperature]
parquet = "temperature_hourly.parquet"
value_col = "temperature"
lag_hours = [1, 3, 6, 12, 24]
use_altitude = true
use_rain_flag = false
circular = false
unit = "C"

[variables.humidity]
parquet = "humidity_hourly.parquet"
value_col = "humidity"
lag_hours = [1, 3, 6, 12, 24]
use_altitude = true
use_rain_flag = true
circular = false
clip_min = 0.0
clip_max = 100.0
unit = "%"

[variables.wind_speed]
parquet = "wind_speed_hourly.parquet"
value_col = "wind_speed"
lag_hours = [1, 3, 6, 12, 24]
use_altitude = true
use_rain_flag = false
circular = false
clip_min = 0.0
unit = "m/s"

[variables.wind_direction]
parquet = "wind_direction_hourly.parquet"
value_col = "wind_direction"
lag_hours = [1, 3, 6, 12]
use_altitude = true
use_rain_flag = false
circular = true
unit = "degree"

[variables.pressure]
parquet = "pressure_hourly.parquet"
value_col = "pressure"
lag_hours = [1, 3, 6, 12, 24]
use_altitude = true
use_rain_flag = false
circular = false
unit = "hPa"
